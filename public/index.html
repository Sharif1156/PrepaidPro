<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PrepaidPro — DESCO &amp; NESCO prepaid meter dashboard</title>
    <meta
      name="description"
      content="Open-source DESCO and NESCO prepaid electricity dashboard: live balance, days remaining, usage insights and low-balance alerts."
    />
    <meta name="theme-color" content="#070d15" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PrepaidPro" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="PrepaidPro — DESCO &amp; NESCO prepaid meter dashboard" />
    <meta
      property="og:description"
      content="Know your prepaid meter balance, how many days are left, and when to recharge. Open source, no tracking, works offline."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <div class="app" id="app">
      <aside class="sidebar" aria-label="Primary">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="34" height="34">
              <defs>
                <linearGradient id="brandBolt" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#5eead4" />
                  <stop offset="1" stop-color="#22d3ee" />
                </linearGradient>
              </defs>
              <rect width="64" height="64" rx="15" fill="#0b1220" />
              <circle cx="32" cy="32" r="22" fill="none" stroke="#123b3a" stroke-width="3" />
              <circle
                cx="32" cy="32" r="22" fill="none" stroke="url(#brandBolt)" stroke-width="3"
                stroke-linecap="round" stroke-dasharray="104 138" transform="rotate(-90 32 32)"
              />
              <path d="M35 12 L21 35h10l-2 17 14-25h-10z" fill="url(#brandBolt)" />
            </svg>
          </span>
          <span class="brand-text">
            <strong>Prepaid<span>Pro</span></strong>
            <small data-i18n="brand.tagline">Meter intelligence</small>
          </span>
        </div>

        <nav class="side-nav" id="sideNav" aria-label="Sections"></nav>

        <div class="sidebar-foot">
          <div class="mini-meter" id="miniMeter"></div>
          <a class="ghost-link" href="https://github.com/Sharif1156/PrepaidPro" target="_blank" rel="noreferrer noopener">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="currentColor">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
            </svg>
            <span>Open source · MIT</span>
          </a>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <div class="page-heading">
              <h1 id="pageTitle">Dashboard</h1>
              <p id="pageSubtitle">Live balance and forecast</p>
            </div>
          </div>
          <div class="topbar-actions">
            <span class="status-pill" id="statusPill" title="Data status">
              <span class="dot"></span>
              <span id="statusText">Connecting…</span>
            </span>
            <button class="icon-btn" id="refreshBtn" aria-label="Refresh balance" title="Refresh">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg>
            </button>
            <button class="avatar" id="avatarBtn" aria-label="Settings" title="Settings">PP</button>
          </div>
        </header>

        <main id="view" tabindex="-1" aria-live="polite"></main>

        <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
      </div>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div class="modal-root" id="modalRoot"></div>
    <div class="scrim" id="scrim" hidden></div>

    <noscript>
      <div class="noscript">
        <h2>PrepaidPro needs JavaScript</h2>
        <p>This dashboard runs entirely in your browser and needs JavaScript enabled.</p>
      </div>
    </noscript>
  </body>
</html>
